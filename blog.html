<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inherited Home Blog | Stairway Mortgage &amp; Blackburn Realty Group</title>
  <meta name="description" content="Guidance for Florida families navigating an inherited home — your options, the steps, and how to decide without pressure.">
  <link rel="canonical" href="https://inheritedhome.stairwaymortgage.com/blog">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/blog.css">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Blog","name":"Inherited Home Blog","url":"https://inheritedhome.stairwaymortgage.com/blog","publisher":{"@type":"Organization","name":"Stairway Mortgage & Blackburn Realty Group"}}</script>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="blog-wrap bc"><a href="/">Home</a><span>&rsaquo;</span>Blog</div>

<section class="blog-hero">
  <div class="blog-wrap">
    <div class="eyebrow">Guidance for Inherited Homes</div>
    <h1>The Inherited Home <em>Blog</em></h1>
    <p>Clear, gentle guidance for Florida families navigating an inherited property — your options, the steps, and how to decide without pressure.</p>
  </div>
</section>

<div class="blog-wrap blog-index">
  <ul class="blog-grid" id="blog-grid"></ul>
  <p class="blog-empty" id="blog-empty" hidden>New articles are on the way. In the meantime, explore <a href="/planning-guide">the planning guide</a> or <a href="/">your options</a>.</p>
</div>

<div id="footer-placeholder"></div>

<script src="/js/components.js"></script>
<script>
(function () {
  var grid = document.getElementById('blog-grid');
  var empty = document.getElementById('blog-empty');
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  fetch('/data/blog-index.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : { posts: [] }; })
    .then(function (data) {
      var posts = (data && data.posts) || [];
      posts.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
      if (!posts.length) { empty.hidden = false; return; }
      grid.innerHTML = posts.map(function (p) {
        var href = '/blog/' + esc(p.slug);
        var img = p.heroImage ? '<a href="' + href + '"><img src="' + esc(p.heroImage) + '" alt="' + esc(p.heroAlt || '') + '" loading="lazy"></a>' : '';
        var tag = p.tag ? '<span class="tag">' + esc(p.tag) + '</span>' : '';
        var date = p.date ? '<span class="date">' + esc(p.date) + '</span>' : '';
        return '<li class="blog-card">' + img + '<div class="bc-body">' + tag +
          '<h2><a href="' + href + '">' + esc(p.title) + '</a></h2>' +
          '<p>' + esc(p.description) + '</p>' + date + '</div></li>';
      }).join('');
    })
    .catch(function () { empty.hidden = false; });
})();
</script>
</body>
</html>
